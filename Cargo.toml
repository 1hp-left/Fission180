[workspace]
members = ["crates/openfusion-core", "crates/openfusion-desktop"]
default-members = ["crates/openfusion-desktop"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
